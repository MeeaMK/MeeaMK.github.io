<!DOCTYPE html>
<html lang="fi"> <!--need to be fin???-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Digitekniikat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- TARKISTA KÄYTIKS EES bootstrappii ET VARMAA
    ????????????????????? -->

    <link rel="stylesheet" href="tyylit_json.css">
</head>
<body>

    <header> 
        <nav>
            <a href="index.html" class="nav-link">Etusivu (Tehtävä 1 OSA 1)</a>
            <a href="T1osa2.html" class="nav-link valittu">Tehtävä 1 OSA 2</a>
            <a href="Poke(T2).html" class="nav-link">Poke haku (Tehtävä 2)</a>
            <a href="T3.html" class="nav-link">Tehtävä 3</a>
        </nav>
    </header> 
    
    

    <main>

        <div class="content"> <!--tänne kaikki muu content myös-->

            <div id="vastaus"></div>

            <script>
                fetch('toteutus_tietue.JSON')
    
                    // Muunnetaan vastaus JSON-tietue JS Olio muotoon
                    .then(function (response) {
                        return response.json();
                    })
    
                    //Käsitellään muunnettu (eli JSON muotoinen) vastaus 
                    // Kutsutaan funktiota kerro()ja välitetään sille json-vastaus
    
                    .then(function (responseJson) {
                        kerro(responseJson);
                    })
    
                    // Jos tuli jokin virhe 
    
                    .catch(function (error) {
                        document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
                    })
    
                //Funktio joka hakee tiedon objektista ja kirjoittaa ne sivulle
    
                function kerro(obj) {

                    const nimet = obj.osallistujat.nimet.join(", ");
                    let tiedot = "<h1>" + obj.otsikko + "</h1>"
    
                    //sisältö 
                        + "<br>"
                        + obj.osallistujat.lukumaara + " opiskelijaa" 
                        + "<br><br>"
                        + nimet 
                        + "<br><br>"
                        + obj.toteutus.alku + " - " + obj.toteutus.loppu 
                        + "<br><br>"
                        + obj.toteutus.kesto_viikkoina + " viikkoa"
                        + "<br><br>"

                    //kuvan määäritteleminen
                        + "<p><img src='" + obj.kuva + "'class= 'respkuva'></p>"
                
    
                    document.getElementById("vastaus").innerHTML = tiedot;
                }
    
            </script>
        </div>
    </main>
</body>
</html>
