<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Digitekniikat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <!--kuvien karuselli-->
        <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner">
               
             <!--kuvat karuselliin-->
                <div class="carousel-item active">
                    <img src="nublik.JPEG" class="d-block w-100" alt="nuubel">

                    <!--caption kuvalle-->
                    <div class="carousel-caption">
                        <h5>BEEEEEP</h5>
                        <p>yks konsertti kuva hyvä räppääjä</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="rock.png" class="d-block w-100" alt="kivi">

                    <div class="carousel-caption">
                        <h5>KIVIIIIII</h5>
                        <p>legendaarinen kivi sairaan kova</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="emttt.jpg" class="d-block w-100" alt="emttt">

                    <div class="carousel-caption">
                        <h5>öö</h5>
                        <p>hello kids</p>
                    </div>

                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
        </div>
    </main>
</body>
