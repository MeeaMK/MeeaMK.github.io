<html lang="fi">

</head>
<body>
  <header>
    <nav>
      <div class="nav-left">
        <a href="index.html" class="logo-link">
          <img src="logoympyrä.png" alt="Etelä-Savon Nuohouspalvelu logo" class="logo">
        </a>
      </div>
     
      <div class="nav-main">
        <a href="index.html">Etusivu</a>
        <a href="index.html#palvelut">Palvelumme</a>
        <a href="index.html#hinnasto">Hinnasto</a>
        <a href="index.html#ajanvaraus">Ajanvaraus</a>
        <a href="kuvat.html" id="valittu">Kuvat</a>
        <a href="ota-yhteytta.html">Ota yhteyttä</a>
      </div>
    </nav>

    <div class="dropdown">
      <button class="dropbtn">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <div class="dropdown-content">
        <a href="index.html">Etusivu</a>
        <a href="index.html#palvelut">Palvelumme</a>
        <a href="index.html#hinnasto">Hinnasto</a>
        <a href="index.html#ajanvaraus">Ajanvaraus</a>
        <a href="kuvat.html">Kuvat</a>
        <a href="ota-yhteytta.html">Ota yhteyttä</a>
      </div>
    </div>
  </header>

  <main>
    <div class="customcontent">
        <h2>Kuvagalleria</h2>
        <img src="katolla.jpg" alt="päivitä tänne alt" class="customimage3">
        <p>Kuvia nuohoustöistä ennen ja jälkeen palveluamme.</p>
      <div class="customcontent3">
        <div class="ennenkuvat">
            <h3>Ennen</h3>
            <img src="n6.jpg" alt="päivitä tänne alt" class="customimage2">
            <img src="n7.jpg" alt="päivitä tänne alt" class="customimage2">
            <img src="n8.jpg" alt="päivitä tänne alt" class="customimage2">
            <img src="n9.jpg" alt="päivitä tänne alt" class="customimage2">
        </div>
        <div class="jälkeenkuvat">
            <h3>Jälkeen</h3>
            <img src="n1.jpg" alt="päivitä tänne alt" class="customimage2">
            <img src="n2.jpg" alt="päivitä tänne alt" class="customimage2">
            <img src="n3.jpg" alt="päivitä tänne alt" class="customimage2">
            <img src="n4.jpg" alt="päivitä tänne alt" class="customimage2">
            <img src="n5.jpg" alt="päivitä tänne alt" class="customimage2">
        </div>
      </div>

      <div class="customcontent3">
        <div class="ennenkuvat">
            <h3>Ennen</h3>
            <img src="n12.jpg" alt="päivitä tänne alt" class="customimage2">
            <img src="n13.jpg" alt="päivitä tänne alt" class="customimage2">
        </div>
        <div class="jälkeenkuvat">
            <h3>Jälkeen</h3>
            <img src="n10.jpg" alt="päivitä tänne alt" class="customimage2">
            <img src="n11.jpg" alt="päivitä tänne alt" class="customimage2">
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 Etelä-Savon Nuohouspalvelu</p>
  </footer>

  <script>
    const dropdownContent = document.querySelector('.dropdown-content');
    const dropdownLinks = document.querySelectorAll('.dropdown-content a');

    dropdownLinks.forEach(link => {
      link.addEventListener('click', () => {
        // piilottaa dropdown sisällön
        dropdownContent.style.display = 'none';
      });
    });

    const dropdownButton = document.querySelector('.dropbtn');
    dropdownButton.addEventListener('click', () => {
      const isVisible = dropdownContent.style.display === 'block';
      dropdownContent.style.display = isVisible ? 'none' : 'block';
    });
  </script>

</body>
</html>
