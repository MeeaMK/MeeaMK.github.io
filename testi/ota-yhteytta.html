<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Etelä-Savon Nuohouspalvelu - Ota yhteyttä</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <div class="nav-left">
        <a href="index.html" class="logo-link">
          <img src="logoympyrä.png" alt="Etelä-Savon Nuohouspalvelu logo" class="logo">
        </a>
      </div>
     
      <div class="nav-main">
        <a href="index.html">Etusivu</a>
        <a href="index.html#palvelut">Palvelumme</a>
        <a href="index.html#hinnasto">Hinnasto</a>
        <a href="index.html#ajanvaraus">Ajanvaraus</a>
        <a href="ota-yhteytta.html" id="valittu">Ota yhteyttä</a>
      </div>
    </nav>

    <div class="dropdown">
      <button class="dropbtn">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <div class="dropdown-content">
        <a href="index.html">Etusivu</a>
        <a href="index.html#palvelut">Palvelumme</a>
        <a href="index.html#hinnasto">Hinnasto</a>
        <a href="index.html#ajanvaraus">Ajanvaraus</a>
        <a href="ota-yhteytta.html">Ota yhteyttä</a>
      </div>
    </div>
  </header>

  <main>
    <div class="customcontent">
      <h1>Yhteystiedot</h1>
      <p><strong>Puhelin:</strong> 041 312 9574</p>
      <p><strong>Sähköposti:</strong> etelasavonnuohouspalvelu@gmail.com</p>
      <p><strong>Facebook:</strong> <a href="https://www.facebook.com/" target="_blank">Etelä-Savon Nuohouspalvelu Facebookissa</a></p>

      <div class="customform">
        <h2>Ota yhteyttä</h2>
     
        <form action="https://formspree.io/f/xldndgkn" method="POST">
          <label for="name">Nimesi:</label>
          <input type="text" id="name" name="name" placeholder="Nimesi" required><br>
          
          <label for="email">Sähköpostisi:</label>
          <input type="email" id="email" name="email" placeholder="Sähköpostisi" required><br>
          
          <label for="message">Viesti:</label>
          <textarea id="message" name="message" placeholder="Kirjoita viestisi tähän" required></textarea><br>
          
          <button type="submit">Lähetä</button>
        </form>
      </div>
      

      
      </form>
    </div>
  </main>

  <footer>
    <p>© 2025 Etelä-Savon Nuohouspalvelu</p>
  </footer>

  <script>
    const dropdownContent = document.querySelector('.dropdown-content');
    const dropdownLinks = document.querySelectorAll('.dropdown-content a');

    dropdownLinks.forEach(link => {
      link.addEventListener('click', () => {
        // piilottaa dropdown sisällön
        dropdownContent.style.display = 'none';
      });
    });

    const dropdownButton = document.querySelector('.dropbtn');
    dropdownButton.addEventListener('click', () => {
      const isVisible = dropdownContent.style.display === 'block';
      dropdownContent.style.display = isVisible ? 'none' : 'block';
    });
  </script>

</body>
</html>
